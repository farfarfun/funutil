[project]
name = "funutil"
version = "1.0.66"
description = "轻量的 Python 通用工具库"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "farlog>=1.1.7", "cachebox>=6.2.6", "cachetools>=5.0.0", "diskcache>=5.0.0", "six>=1.16.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funutil"
Releases = "https://github.com/farfarfun/funutil/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=7.0"]
